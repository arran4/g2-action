name: Correct g2-action v1 tags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-v1-tags.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-release-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged action
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify merged source-ref installer
        shell: bash
        env:
          TARGET_SHA: 98d19f25b72b1ef0b3e8222ce80c4fefc5bd5276
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          test -f resolve-install.sh
          test -f build-source.sh
          bash -n resolve-install.sh build-source.sh setup.sh

      - name: Smoke-test source-ref installation
        uses: ./
        with:
          source-ref: main

      - name: Verify installed binary
        shell: bash
        run: g2 lint --help

      - name: Publish v1.3 and retarget floating v1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 98d19f25b72b1ef0b3e8222ce80c4fefc5bd5276
          EXPECTED_OLD_V1_TAG_OBJECT: 4b666827d5c95124f6a2def50ae87bf9ef51f0df
        run: |
          set -euo pipefail

          # An existing versioned release must never be silently overwritten.
          ref_api="repos/$GITHUB_REPOSITORY/git/ref/tags"
          if gh api "$ref_api/v1.3" > /tmp/g2-action-v1.3-ref.json 2>/dev/null; then
            existing_version=$(jq -r '.object.sha' /tmp/g2-action-v1.3-ref.json)
          else
            existing_version=""
          fi
          if [[ -n "$existing_version" && "$existing_version" != "$TARGET_SHA" ]]; then
            echo "::error::v1.3 exists at unexpected SHA $existing_version"
            exit 1
          fi
          if [[ -z "$existing_version" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/v1.3 -f sha="$TARGET_SHA" >/dev/null
          fi

          if ! gh release view v1.3 >/dev/null 2>&1; then
            gh release create v1.3 --verify-tag --generate-notes \
              --title 'g2-action v1.3' \
              --notes 'Adds source-ref/branch/commit installation and automatic Go toolchain selection. See PR #21.'
          fi

          old_v1=$(gh api "$ref_api/v1" --jq '.object.sha')
          if [[ "$old_v1" != "$TARGET_SHA" ]]; then
            if [[ "$old_v1" != "$EXPECTED_OLD_V1_TAG_OBJECT" ]]; then
              echo "::error::v1 tag moved unexpectedly; refusing to overwrite $old_v1"
              exit 1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1" \
              -f sha="$TARGET_SHA" -F force=true >/dev/null
          fi

          actual_version=$(gh api "$ref_api/v1.3" --jq '.object.sha')
          actual_major=$(gh api "$ref_api/v1" --jq '.object.sha')
          [[ "$actual_version" == "$TARGET_SHA" && "$actual_major" == "$TARGET_SHA" ]] || {
            echo "::error::Tag verification failed: v1.3=$actual_version, v1=$actual_major"
            exit 1
          }
          {
            echo '## Corrected g2-action release tags'
            echo "- v1.3: `$actual_version`"
            echo "- v1: `$actual_major`"
            echo '- v1.2: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
