name: 'g2-action'
description: 'Download, install and run g2 (Gentoo Tools by arran4)'
author: 'arran4'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  version:
    description: 'g2 release (latest or a v* version), branch, or commit SHA to install.'
    required: false
    default: 'latest'
  source-ref:
    description: 'Explicit g2 git ref or commit SHA to build. Overrides version; useful for tag-like branch names.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token to authenticate API requests to prevent rate limiting.'
    required: false
    default: ${{ github.token }}
  action:
    description: 'The action to run with g2.'
    required: false
    default: ''
  mode:
    description: 'The execution mode: "install", "install and run", or "run".'
    required: false
    default: 'install'
  git-clone-timeout:
    description: 'The timeout for git clone operations.'
    required: false
    default: ''
  format:
    description: 'The output format (e.g. "github-actions").'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve g2 installation source
      id: source
      if: ${{ inputs.mode == 'install' || inputs.mode == 'install and run' }}
      shell: bash
      env:
        G2_VERSION: ${{ inputs.version }}
        G2_SOURCE_REF: ${{ inputs.source-ref }}
      run: bash "$GITHUB_ACTION_PATH/resolve-install.sh"
    - name: Set up Go for source build
      if: ${{ steps.source.outputs.from_source == 'true' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ steps.source.outputs.source_dir }}/go.mod
        cache: false
    - name: Build and install g2 from source
      if: ${{ steps.source.outputs.from_source == 'true' }}
      shell: bash
      env:
        G2_SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        G2_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
      run: bash "$GITHUB_ACTION_PATH/build-source.sh"
    - name: Install g2 from release
      if: ${{ steps.source.outputs.from_source == 'false' }}
      shell: bash
      env:
        G2_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh" "$G2_VERSION" "$GITHUB_TOKEN"
    - name: Run g2 action
      if: ${{ inputs.mode == 'run' || inputs.mode == 'install and run' }}
      run: |
        G2_ARGS=()
        if [ -n "${{ inputs.git-clone-timeout }}" ]; then
          G2_ARGS+=("--git-clone-timeout=${{ inputs.git-clone-timeout }}")
        fi
        if [ -n "${{ inputs.format }}" ]; then
          G2_ARGS+=("--format=${{ inputs.format }}")
        fi
        g2 ${{ inputs.action }} "${G2_ARGS[@]}"
      shell: bash
